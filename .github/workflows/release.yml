name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pymupdf

      - name: Run Quality Gate & Test Suite
        run: |
          pip install pytest
          python -m pytest -v tests/

      - name: Compile Standalone Executable & Package ZIP
        run: |
          python scripts/build_exe.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SmartFileOrganizer_v3.0_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
