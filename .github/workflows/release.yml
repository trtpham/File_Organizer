name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install GUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Quality Gate & Test Suite
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p sfo-cli -p sfo-gui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "SmartFileOrganizer_${{ github.ref_name }}_${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sfo.exe, target/${{ matrix.target }}/release/sfo-gui.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          name="SmartFileOrganizer_${{ github.ref_name }}_${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/sfo target/${{ matrix.target }}/release/sfo-gui README.md LICENSE "$name"/
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
