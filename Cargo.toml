[workspace]
resolver = "3"
members = ["crates/sfo-core", "crates/sfo-cli", "crates/sfo-gui", "crates/sfo-compat-tests"]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Raven (Pham Minh Triet) <trietpham1912@gmail.com>"]
repository = "https://github.com/trtpham/File_Organizer"

[workspace.dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
egui_kittest = "0.31"
rfd = "0.15"
anstream = "0.6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rpassword = "7"
aes-gcm = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sysinfo = { version = "0.35", default-features = false, features = ["disk", "system"] }
tiny_http = "0.12"
winreg = "0.55"
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sfo-core = { path = "crates/sfo-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
dunce = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
lopdf = "0.34"
md-5 = "0.10"
rayon = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2 and PBKDF2 are unusably slow unoptimized; keep debug tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
