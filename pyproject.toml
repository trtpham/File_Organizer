[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "3.0.0"
description = "Enterprise-grade automated file organization, visual deduplication, storage optimization, and transactional rollback application."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Raven (Pham Minh Triet)", email = "trietpham1912@gmail.com" }
]
keywords = ["file-organizer", "deduplication", "automation", "cleaner", "productivity", "gui", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]
rich = [
    "rich>=13.0.0",
    "watchfiles>=0.20.0"
]

[project.scripts]
sfo = "smart_file_organizer.cli.app:run_cli"
smart-file-organizer = "smart_file_organizer.cli.app:run_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
